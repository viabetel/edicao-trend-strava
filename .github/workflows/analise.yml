name: Análise do vídeo (na nuvem)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg e Python
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy opencv-python-headless matplotlib
      - name: Baixa o original (release "original")
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download original -p IMG_1977.MOV -D bruto
      - name: Prévia 1080x1920 SDR 30 q/s (HDR HLG convertido)
        run: |
          mkdir -p previa
          ffmpeg -y -v error -i bruto/IMG_1977.MOV -map 0:v:0 -map 0:a:0 \
            -vf "zscale=w=1080:h=1920:tin=arib-std-b67:min=bt2020nc:pin=bt2020:rin=tv:t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=hable:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,fps=30" \
            -c:v libx264 -crf 22 -preset slow -c:a aac -b:a 192k -movflags +faststart previa/IMG_1977_1080x1920.mp4 \
          || ffmpeg -y -v error -i bruto/IMG_1977.MOV -map 0:v:0 -map 0:a:0 -vf "scale=1080:1920,format=yuv420p,fps=30" \
            -c:v libx264 -crf 22 -preset slow -c:a aac -b:a 192k -movflags +faststart previa/IMG_1977_1080x1920.mp4
          ls -la previa
      - name: Ficha, folhas, quadros, gráficos e áudio
        run: |
          mkdir -p analise
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,profile,width,height,r_frame_rate,nb_frames,pix_fmt,color_transfer,color_primaries,channels,sample_rate:stream_side_data=rotation -of json bruto/IMG_1977.MOV > analise/ficha_original.json
          python scripts/analise.py previa/IMG_1977_1080x1920.mp4 analise
          ffmpeg -y -v error -i previa/IMG_1977_1080x1920.mp4 -filter_complex "showwavespic=s=1800x300:split_channels=1:colors=white" -frames:v 1 analise/audio_onda.png
          ffmpeg -y -v error -i previa/IMG_1977_1080x1920.mp4 -lavfi "showspectrumpic=s=1800x500:legend=1" analise/audio_espectro.png
          ffmpeg -hide_banner -nostats -i previa/IMG_1977_1080x1920.mp4 -af ebur128=peak=true -f null - 2>&1 | grep -E "I:|LRA:|Peak:" | tail -3 > analise/audio_loudness.txt || true
          ls -la analise
      - name: Commit
        run: |
          git config user.name "analise-nuvem"
          git config user.email "analise-nuvem@users.noreply.github.com"
          git add previa analise
          git commit -m "Análise do IMG_1977 (GitHub Actions)" || echo "nada novo"
          git push
