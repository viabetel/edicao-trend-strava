name: Edição trend Strava · render na nuvem

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "sufixo da entrega (ex.: v1)"
        required: true
        default: "v1"

permissions:
  contents: write

concurrency:
  group: edicao
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg e Python
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy opencv-python-headless
      - name: RIFE (ncnn, CPU) para os quadros intermediários
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers unzip
          curl -sSL -o rife.zip https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-ubuntu.zip
          unzip -q rife.zip -d rife
          D=$(ls -d "$PWD"/rife/rife-ncnn-vulkan-*/ | head -1)
          chmod +x "${D}rife-ncnn-vulkan"; ls "$D"
          ffmpeg -v error -f lavfi -i testsrc2=s=320x568:d=0.2:r=10 -frames:v 2 rife_t%d.png
          "${D}rife-ncnn-vulkan" -0 rife_t1.png -1 rife_t2.png -o rife_teste.png -m "${D}rife-v4.6" -s 0.3 -g -1 -u && ls -la rife_teste.png
          echo "RIFE_BIN=${D}rife-ncnn-vulkan" >> "$GITHUB_ENV"
          echo "RIFE_MODELO=${D}rife-v4.6" >> "$GITHUB_ENV"
      - name: Original (release "original")
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download original -p IMG_1977.MOV -D bruto
      - name: Base (corte, rampa, empurrão, áudio na mesma régua)
        run: |
          python scripts/base.py bruto/IMG_1977.MOV edicao/src/tempos.json out
          cp out/base.mp4 edicao/public/base.mp4
      - name: Remotion (4K com --scale=2, ProRes HQ)
        working-directory: edicao
        run: |
          npm install --no-audit --no-fund
          npx tsc
          npx remotion browser ensure
          mkdir -p ../out/provas
          for q in 0 84 92 110 130 143 150 156 158 159 160 161 162 163 164 170 192 230 297; do
            npx remotion still src/index.ts TrendPoca "../out/provas/q$(printf %03d "$q").png" --frame="$q" --log=error
          done
          npx remotion render src/index.ts TrendPoca ../out/video.mov --codec=prores --prores-profile=hq --scale=2 --concurrency=2 --log=error
      - name: Master 4K, prévia 1080, mixagem e folhas
        run: |
          V="${{ inputs.versao }}"; [ -n "$V" ] || V="v8"; D=entregas; mkdir -p "$D" out/master; N="IMG_1977_trend_strava_${V}"
          MUSIC="edicao/public/$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['musica'])")"
          if [ ! -f "$MUSIC" ]; then echo "Faixa não encontrada: $MUSIC"; exit 1; fi
          DUR="$(python -c "import json; t=json.load(open('edicao/src/tempos.json')); print(t['quadros']/t['fps'])")"
          OFFSET="$(python -c "import json; a=json.load(open('edicao/src/tempos.json'))['audio']; print(a['dropMusica']-a['dropVideo'])")"
          FADE_IN="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['fadeEntrada'])")"
          FADE_OUT="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['fadeSaida'])")"
          MUSIC_GAIN="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['ganhoMusica'])")"
          MUSIC_SLOW_GAIN="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['ganhoMusicaNoSlow'])")"
          SLOW_IN="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['slowSaida'][0])")"
          SLOW_OUT="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['slowSaida'][1])")"
          IMPACT_IN="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['impactoSom'][0])")"
          IMPACT_OUT="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['impactoSom'][1])")"
          IMPACT_FADE_IN="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['impactoFadeEntrada'])")"
          IMPACT_FADE_OUT="$(python -c "import json; print(json.load(open('edicao/src/tempos.json'))['audio']['impactoFadeSaida'])")"
          FADE_START="$(python -c "print(float('$DUR')-float('$FADE_OUT'))")"
          ffmpeg -y -loglevel error -ss "$OFFSET" -i "$MUSIC" -map 0:a:0 -t "$DUR" -af "aresample=48000,afade=t=in:st=0:d=$FADE_IN,afade=t=out:st=$FADE_START:d=$FADE_OUT" -ar 48000 -ac 2 out/music.wav
          AMBIENT_FILTER="if(lt(t,$IMPACT_IN),0,if(lt(t,$IMPACT_IN+$IMPACT_FADE_IN),(t-$IMPACT_IN)/$IMPACT_FADE_IN,if(lt(t,$IMPACT_OUT-$IMPACT_FADE_OUT),1,if(lt(t,$IMPACT_OUT),($IMPACT_OUT-t)/$IMPACT_FADE_OUT,0))))"
          ffmpeg -y -loglevel error -i out/audio.wav -i out/music.wav -filter_complex "[0:a]volume='$AMBIENT_FILTER':eval=frame[amb];[1:a]volume='if(between(t,$SLOW_IN,$SLOW_OUT),$MUSIC_SLOW_GAIN,$MUSIC_GAIN)':eval=frame[mus];[amb][mus]amix=inputs=2:duration=first:dropout_transition=0:normalize=0" -ar 48000 -ac 2 out/audio_mix.wav
          ffmpeg -hide_banner -nostats -i out/audio_mix.wav -af loudnorm=I=-14:TP=-1.5:LRA=11:print_format=json -f null - 2> out/ln1.txt
          LN=$(python -c "import json,re; t=open('out/ln1.txt').read(); d=json.loads(t[t.rindex('{'):t.rindex('}')+1]); print('measured_I=%s:measured_TP=%s:measured_LRA=%s:measured_thresh=%s:offset=%s' % (d['input_i'], d['input_tp'], d['input_lra'], d['input_thresh'], d['target_offset']))")
          ffmpeg -y -loglevel error -i out/audio_mix.wav -af "loudnorm=I=-14:TP=-1.5:LRA=11:$LN:linear=true" -ar 48000 out/audio_master.wav
          ffmpeg -y -loglevel error -i out/video.mov -i out/audio_master.wav -map 0:v -map 1:a             -c:v libx264 -preset slow -crf 12 -profile:v high -pix_fmt yuv420p -color_primaries bt709 -color_trc bt709 -colorspace bt709             -c:a aac -b:a 320k -shortest -movflags +faststart "out/master/${N}_4K.mp4"
          ffmpeg -y -loglevel error -i "out/master/${N}_4K.mp4" -vf "scale=1080:1920:flags=lanczos" -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p -c:a copy -movflags +faststart "$D/${N}_1080_previa.mp4"
          ffmpeg -y -loglevel error -i "$D/${N}_1080_previa.mp4" -vf "fps=6,scale=180:-2,tile=10x6:padding=4:color=white" -frames:v 1 "$D/${N}_folha.jpg"
          ffmpeg -y -loglevel error -ss 2.8 -t 2.6 -i "$D/${N}_1080_previa.mp4" -vf "scale=180:-2,tile=13x6:padding=4:color=white" -frames:v 1 "$D/${N}_folha_camera_lenta_todos.jpg"
          ffmpeg -y -loglevel error -ss 5.1 -t 0.8 -i "$D/${N}_1080_previa.mp4" -vf "scale=270:-2,tile=8x3:padding=4:color=white" -frames:v 1 "$D/${N}_folha_soltura_e_batida.jpg"
          ffmpeg -hide_banner -nostats -i "out/master/${N}_4K.mp4" -af ebur128=peak=true -f null - 2>&1 | grep -E "I:|LRA:|Peak:" | tail -3 > "$D/${N}_loudness.txt" || true
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,r_frame_rate,nb_frames,bit_rate:format=duration,size -of compact "out/master/${N}_4K.mp4" > "$D/${N}_ficha_4K.txt"
          python scripts/qa.py --mapa "out/mapa_quadros.json" --tempos edicao/src/tempos.json --video "out/master/${N}_4K.mp4" --loudness "$D/${N}_loudness.txt" --out "$D/${N}_qa.json"
          mkdir -p "$D/${N}_provas" && cp out/provas/*.png "$D/${N}_provas/" && cp out/mapa_quadros.json "$D/${N}_mapa_quadros.json"
          ls -la "$D" out/master
      - name: Master 4K na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.versao }}"; [ -n "$V" ] || V="v8"
          gh release create "entrega-${V}" "out/master/IMG_1977_trend_strava_${V}_4K.mp4" --title "Entrega ${V} · master 4K" --notes "Master 2160 x 3840, H.264 High CRF 12, áudio AAC 320 kbps, −14 LUFS." ||           gh release upload "entrega-${V}" "out/master/IMG_1977_trend_strava_${V}_4K.mp4" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edicao-${{ inputs.versao }}
          path: entregas/
      - name: Commit da entrega
        run: |
          git config user.name "render-nuvem"
          git config user.email "render-nuvem@users.noreply.github.com"
          git add entregas/
          git commit -m "Entrega: trend Strava ${{ inputs.versao }} (GitHub Actions)" || echo "nada novo"
          git pull --rebase -q && git push
